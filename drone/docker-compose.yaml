services:
  drone:
    image: drone/drone:2
    container_name: drone
    network_mode: host
    volumes:
      - ./drone:/data
    restart: always
    environment:
      - DRONE_GITEA_SERVER=http://192.168.1.20:3000
      - DRONE_GITEA_CLIENT_ID=ca4d3e7f-7094-45ae-86f3-c793e2228e45
      - DRONE_GITEA_CLIENT_SECRET=gto_3jlbe2hnsz2kzyumusnn72f4r5utuo5uwwnwzac7td4ljl2oil5a
      - DRONE_RPC_SECRET=super-secret-string
      - DRONE_SERVER_HOST=192.168.1.20
      - DRONE_SERVER_PROTO=http

  runner:
    image: drone/drone-runner-docker:1
    container_name: drone-runner
    network_mode: host  
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DRONE_RPC_HOST=127.0.0.1
      - DRONE_RPC_PROTO=http
      - DRONE_RPC_SECRET=super-secret-string
      - DRONE_RUNNER_CAPACITY=2
      - DRONE_RUNNER_NAME=runner-1

