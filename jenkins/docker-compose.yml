services:
  jenkins:
    image: "jenkins/jenkins"
    container_name: jenkins
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    user: root
    network_mode: host  
    volumes:
      - "/mnt/data/jenkins:/var/jenkins_home"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/usr/bin/docker:/usr/bin/docker"
